name: Garmin extract

on:
  workflow_dispatch: {}
  schedule:
    # GitHub Actions cron is UTC-only, so PST/PDT needs two entries to land
    # at 2am Pacific year-round. The month boundaries are an approximation of
    # the actual (Sunday-based) DST transition dates, so the run may land at
    # 1am or 3am Pacific for up to ~1 week around the March/November switch.
    - cron: "0 10 * 1-3,11-12 *" # 2am PST (standard time, roughly Nov-Mar)
    - cron: "0 9 * 4-10 *" # 2am PDT (daylight time, roughly Apr-Oct)

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r extraction/requirements.txt

      - name: Restore Garmin session cache
        run: |
          mkdir -p ~/.garminconnect
          echo "$GARMIN_TOKEN_STORE" | base64 -d | tar -xzf - -C ~/.garminconnect
        env:
          GARMIN_TOKEN_STORE: ${{ secrets.GARMIN_TOKEN_STORE }}

      - name: Restore Snowflake private key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$SNOWFLAKE_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/keys/snowflake_key.p8"
          chmod 600 "$RUNNER_TEMP/keys/snowflake_key.p8"
        env:
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}

      - name: Run extraction
        working-directory: extraction
        run: python -m garmin.main
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_PROXY_URL: ${{ secrets.GARMIN_PROXY_URL }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ runner.temp }}/keys/snowflake_key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
