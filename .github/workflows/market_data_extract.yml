name: Market data extract

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated table names to run (default: all): tickers,daily_prices"
        required: false
        default: ""
      tickers:
        description: "Comma-separated Yahoo tickers to fetch prices for instead of the whole universe"
        required: false
        default: ""
      since:
        description: "ISO date (YYYY-MM-DD) to fetch prices from, overriding per-ticker watermarks"
        required: false
        default: ""
  schedule:
    # Twice a week, Tuesday 10pm and Friday 3pm Pacific, both after the US
    # close (1pm Pacific) so every landed bar is final. Each ticker
    # refetches from its last landed date minus a buffer, so two runs a week
    # still capture every session. GitHub Actions cron is UTC-only, so
    # PST/PDT needs paired entries (Tuesday 10pm Pacific is early Wednesday
    # UTC); same month-boundary approximation as
    # garmin_extract.yml, so a run may land an hour early/late for up to ~1
    # week around the DST switch.
    - cron: "0 6 * 1-3,11-12 3" # Tue 10pm PST (standard time, roughly Nov-Mar)
    - cron: "0 5 * 4-10 3" # Tue 10pm PDT (daylight time, roughly Apr-Oct)
    - cron: "0 23 * 1-3,11-12 5" # Fri 3pm PST
    - cron: "0 22 * 4-10 5" # Fri 3pm PDT

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r extraction/requirements.txt

      - name: Restore Snowflake private key
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$SNOWFLAKE_PRIVATE_KEY_B64" | base64 -d > "$RUNNER_TEMP/keys/snowflake_key.p8"
          chmod 600 "$RUNNER_TEMP/keys/snowflake_key.p8"
        env:
          SNOWFLAKE_PRIVATE_KEY_B64: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_B64 }}

      - name: Run extraction
        working-directory: extraction
        run: |
          args=()
          if [ -n "$ONLY" ]; then
            args+=(--only "$ONLY")
          fi
          if [ -n "$TICKERS" ]; then
            args+=(--tickers "$TICKERS")
          fi
          if [ -n "$SINCE" ]; then
            args+=(--since "$SINCE")
          fi
          python -m market_data.main "${args[@]}"
        env:
          # workflow_dispatch inputs passed as data via env vars, never spliced
          # into the run: string directly — same hardening as plaid_extract.yml.
          ONLY: ${{ github.event.inputs.only }}
          TICKERS: ${{ github.event.inputs.tickers }}
          SINCE: ${{ github.event.inputs.since }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          # SNOWFLAKE_SCHEMA is not passed — market_data/snowflake_writer.py
          # fixes it to MARKET_DATA.
          SNOWFLAKE_PRIVATE_KEY_PATH: ${{ runner.temp }}/keys/snowflake_key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
