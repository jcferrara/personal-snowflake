name: 'personal_snowflake'
version: '1.0.0'
config-version: 2

profile: 'personal_snowflake'

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dbt_date:time_zone: 'America/Los_Angeles'
  dim_dates_start_date: '2020-01-01'
  dim_dates_end_date: "{{ (modules.datetime.date.today() + modules.datetime.timedelta(days=365)).strftime('%Y-%m-%d') }}"
  # Investment transactions before this date come from
  # RAW.MANUAL.INVESTMENT_TRANSACTIONS_HISTORICAL; on/after it, from Plaid.
  investment_plaid_cutover_date: '2026-10-11'

models:
  personal_snowflake:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    metrics:
      +materialized: table
