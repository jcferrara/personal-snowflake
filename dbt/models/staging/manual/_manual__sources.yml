version: 2

sources:
  - name: manual
    database: RAW
    schema: MANUAL
    description: >
      Hand-maintained reference data loaded directly into Snowflake (no
      extraction pipeline). Used for facts that no API source provides,
      such as consolidated brokerage history.
    tables:
      - name: investment_transactions_historical
        description: >
          Consolidated brokerage transaction history (TD Ameritrade, then
          Charles Schwab after the account conversion), assembled from
          brokerage CSV exports plus a few synthetic rows that close gaps
          between them (flagged is_synthetic, explained in synthetic_note).
          Source of truth for all investment activity before the Plaid
          cutover date (dbt var investment_plaid_cutover_date). One row per
          transaction, keyed by txn_id.
