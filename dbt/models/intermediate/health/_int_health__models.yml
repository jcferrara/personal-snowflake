version: 2

models:
  - name: int_body_metrics_pivoted
    description: >
      Apple Health body metrics pivoted from one row per (metric_name,
      recorded_at, source_app) to one row per reading event, with each
      metric type as its own column. Built from
      stg_apple_health__body_metrics. Grain: recorded_at x source_app (a
      smart-scale reading that reports body mass index, body fat
      percentage, and weight together lands as a single row here). Not
      meant for direct querying — see int_body_metrics_aggregated_to_day
      for the day-grain version fct_body_metrics builds on.
    columns:
      - name: sk
        description: Surrogate key (recorded_at, source_app).
        data_tests:
          - unique
          - not_null
      - name: source_app
        description: >
          Name of the app or integration that exported this reading (e.g.
          "health_auto_export").
      - name: body_mass_index
        description: >
          Body mass index at this reading. Unitless; NULL if this reading
          event didn't report it.
      - name: body_fat_percentage
        description: >
          Body fat percentage at this reading. NULL if this reading event
          didn't report it.
      - name: weight_lb
        description: >
          Body weight at this reading, in pounds. NULL if this reading
          event didn't report it.
      - name: recorded_date
        description: Calendar date of the reading, derived from recorded_at.
      - name: recorded_at
        description: Timestamp the reading was recorded on the source device.

  - name: int_body_metrics_aggregated_to_day
    description: >
      Collapses int_body_metrics_pivoted's reading-event grain to one row
      per day, averaging each metric across that day's readings when a
      day has more than one (e.g. a scale synced twice). Averaging rather
      than picking one reading means a reading that only captured some
      metrics doesn't zero out the day's average for the ones it missed.
      Grain: recorded_date x source_app.
    columns:
      - name: sk
        description: Surrogate key (recorded_date, source_app).
        data_tests:
          - unique
          - not_null
      - name: source_app
        description: >
          Name of the app or integration that exported this reading (e.g.
          "health_auto_export").
      - name: body_mass_index
        description: >
          Body mass index, averaged across the day's readings. NULL if no
          reading that day captured it.
      - name: body_fat_percentage
        description: >
          Body fat percentage, averaged across the day's readings. NULL if
          no reading that day captured it.
      - name: weight_lb
        description: >
          Weight in pounds, averaged across the day's readings. NULL if no
          reading that day captured it.
      - name: recorded_date
        description: Calendar date of the reading(s) this row summarizes.
