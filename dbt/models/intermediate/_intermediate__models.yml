version: 2

models:
  - name: int_dates_spine
    description: >
      Calendar date spine generated by the dbt_date package, from
      {{ var('dim_dates_start_date') }} through one year past the current
      date. One row per calendar day with no business logic applied — a
      thin wrapper isolating the raw dbt_date output from the final
      dim_dates model.
    columns:
      - name: date_day
        description: Calendar date. Grain of this model.
        data_tests:
          - unique
          - not_null
